; Configuración del nodo solar autónomo
; Práctica final de Comunicaciones Inalámbricas y Protocolos para el IoT.
; El transporte (enlace con la estación base) se elige por target de compilación:
;   pio run -e esp32-c3-wifi    -> WiFi + MQTT (broker local)
;   pio run -e esp32-c3-usb     -> USB-CDC directo a la base
;   pio run -e esp32-c3-espnow  -> ESP-NOW al puente (la base inyecta en el broker)
; La consola de depuración y el enlace comparten el USB-CDC (Serial) en USB/ESP-NOW.

[env:esp32-c3-supermini]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c3-devkitm-1
board_build.mcu = esp32c3
framework = arduino
monitor_speed = 115200

; Habilitar la consola USB-CDC dejando el UART0 libre
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; Librerías de sensores y comunicación
lib_deps =
    adafruit/Adafruit AHTX0
    adafruit/Adafruit BMP280 Library
    adafruit/Adafruit VEML7700 Library
    robtillaart/INA226
    sparkfun/SparkFun AS3935 Lightning Detector Arduino Library
    paulstoffregen/OneWire
    milesburton/DallasTemperature
    bblanchon/ArduinoJson
    marvinroger/AsyncMqttClient

[env:esp32-c3-wifi]
extends = env:esp32-c3-supermini
build_flags =
    ${env:esp32-c3-supermini.build_flags}
    -D TRANSPORTE_WIFI

[env:esp32-c3-usb]
extends = env:esp32-c3-supermini
build_flags =
    ${env:esp32-c3-supermini.build_flags}
    -D TRANSPORTE_USB

[env:esp32-c3-espnow]
extends = env:esp32-c3-supermini
build_flags =
    ${env:esp32-c3-supermini.build_flags}
    -D TRANSPORTE_ESP_NOW
