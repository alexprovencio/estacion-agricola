[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "estacion-base"
version = "0.1.0"
description = "Estación base para la estación agrícola autónoma"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyserial",
    "RPi.GPIO",
    "Pillow",
    "luma.lcd",
    "luma.core",
    "adafruit-circuitpython-neopixel",
    "py-espeak-ng",
    "requests",
    "python-dotenv",
]

[project.scripts]
estacion-base = "estacion_base.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
